<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMBA Student Council</title>
<meta name="description" content="Prototype of the OMBA Student Council site: calendar, feedback, club directory, and resources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--blue:#00274C;--maize:#FFCB05;--ink:#14263A;--muted:#43546A;--line:#D5DDE7;--line2:#E1E7EF;--bg:#F4F6F9;--ctrl:#6F86A3}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Libre Franklin',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #2F65A7;outline-offset:2px}
.dark button:focus-visible,.on-dark:focus-visible{outline-color:var(--maize)}
.serif{font-family:'Source Serif 4',Georgia,serif}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;width:100%}
.banner{background:var(--maize);color:var(--blue);font-size:13px;font-weight:600;padding:8px 24px;text-align:center}
header.top{background:var(--blue);color:#fff}
header.top .wrap{padding-top:16px;padding-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:52px;height:44px;background:var(--maize);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:.03em;border-radius:6px}
.brand-name{font-size:21px;font-weight:700;line-height:1.1}
.brand-sub{font-size:13px;color:#C9D6E6;margin-top:2px}
nav.main{display:flex;flex-wrap:wrap;gap:4px}
nav.main button{border:0;border-radius:6px;padding:11px 16px;min-height:44px;font-size:15px;font-weight:600;background:transparent;color:#fff}
nav.main button[aria-current="page"]{background:var(--maize);color:var(--blue)}
nav.main button:focus-visible{outline-color:var(--maize)}
.hero{background:var(--blue);color:#fff;border-top:1px solid rgba(255,255,255,.14)}
.hero .wrap{padding-top:64px;padding-bottom:72px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--maize);text-transform:uppercase}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.08;margin:14px 0 18px;max-width:760px;font-weight:700}
.hero p{font-size:19px;line-height:1.5;color:#D6E0EC;max-width:640px;margin:0 0 32px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.btn{border-radius:8px;padding:14px 24px;min-height:48px;font-size:16px;font-weight:700;border:2px solid transparent}
.btn-maize{background:var(--maize);color:var(--blue)}
.btn-ghost{background:transparent;color:#fff;border-color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-out{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn-sm{padding:10px 18px;min-height:44px;font-size:14px}
.btn-on{background:var(--maize);color:var(--blue);border-color:var(--blue)}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;font-size:14px;text-decoration:underline;padding:8px 0}
.page{padding:40px 24px 56px}
.page h1{font-size:40px;margin:0 0 8px;color:var(--blue)}
.lede{font-size:17px;color:var(--muted);margin:0 0 28px;max-width:680px;line-height:1.5}
.grid{display:grid;gap:16px}
.g-240{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g-300{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g-320{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
.lift{transition:box-shadow .15s}
.lift:hover{box-shadow:0 6px 18px rgba(0,39,76,.14)}
.qcard{text-align:left;display:block;color:var(--ink);font-size:inherit}
.qicon{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--blue);color:var(--maize);margin-bottom:16px}
.qtitle{display:block;font-size:18px;font-weight:700;color:var(--blue)}
.qblurb{display:block;font-size:14.5px;line-height:1.5;color:var(--muted);margin-top:6px}
.split{display:flex;flex-wrap:wrap;gap:20px}
.split>.card{flex:1 1 360px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.cardhead h2,.h2{font-size:24px;margin:0;color:var(--blue)}
.evrow{display:flex;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line2)}
.datebox{width:56px;flex:none;text-align:center;background:var(--blue);color:var(--maize);border-radius:8px;padding:6px 0}
.datebox.lg{width:60px;padding:8px 0}
.datebox .m{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.datebox .d{font-size:22px;font-weight:800;line-height:1.1}
.datebox.lg .d{font-size:24px}
.evtitle{font-weight:700;font-size:16px;color:var(--blue)}
.sub{font-size:14px;color:var(--muted);margin-top:2px}
.label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.body16{margin:4px 0 14px;font-size:16px;line-height:1.45}
.controls{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;margin-bottom:20px}
.controls .label{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:8px 16px;min-height:44px;font-size:14px;font-weight:600;background:#fff;color:var(--blue);border:1.5px solid var(--ctrl)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.calbox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--blue);color:#fff}
.calhead h2{font-size:26px;margin:0}
.navbtn{background:var(--maize);color:var(--blue);border:0;border-radius:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.scroll{overflow-x:auto}
.calwrap{min-width:720px}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{background:#E6ECF3;border-bottom:1px solid var(--line)}
.dow div{padding:10px 8px;font-size:12px;font-weight:700;color:var(--blue);text-align:center;letter-spacing:.06em}
.cell{min-height:108px;padding:8px 6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-width:0;background:#fff}
.cell.empty{background:var(--bg)}
.dnum{min-width:26px;height:26px;padding:0 4px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);font-weight:600}
.dnum.today{background:var(--maize);color:var(--blue);font-weight:800}
.pill{margin-top:4px;padding:3px 6px;border-radius:4px;font-size:11.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-Council{background:#FFCB05;color:#00274C;border:1px solid #FFCB05}
.cat-Career{background:#00274C;color:#fff;border:1px solid #00274C}
.cat-Clubs{background:#B9CBE0;color:#00274C;border:1px solid #B9CBE0}
.cat-Social{background:#fff;color:#00274C;border:1.5px solid #00274C}
.cat-Residency{background:#4F6682;color:#fff;border:1px solid #4F6682}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700}
.evcard{display:flex;gap:16px;align-items:flex-start;padding:18px}
.evcard .t{font-weight:700;font-size:17px;color:var(--blue);margin-top:8px;line-height:1.3}
.evcard .btn{margin-top:12px}
.empty-note{background:#fff;border:1px dashed var(--ctrl);border-radius:12px;padding:28px;color:var(--muted);font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--blue)}
.input{min-height:46px;border:1.5px solid var(--ctrl);border-radius:8px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink)}
textarea.input{padding:12px;line-height:1.5;resize:vertical}
.stack{display:flex;flex-direction:column;gap:18px}
.checkrow{display:flex;align-items:center;gap:12px;font-size:15px;min-height:44px}
.checkrow input{width:22px;height:22px;accent-color:var(--blue)}
.err{font-size:14px;font-weight:600;color:#8A1C1C}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
.okmark{width:60px;height:60px;margin:0 auto 18px;border-radius:30px;background:var(--maize);color:var(--blue);display:flex;align-items:center;justify-content:center}
.status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.st-Done{background:var(--maize);color:var(--blue)}
.st-prog{background:var(--blue);color:#fff}
.st-rev{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.tcard{padding:20px}
.tcard .label{margin-top:12px}
.tcard .label.first{margin-top:12px}
.cluborg{width:48px;height:48px;border-radius:10px;background:var(--blue);color:var(--maize);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#E6ECF3;color:var(--blue)}
.club{padding:22px;display:flex;flex-direction:column}
.club h3{font-size:19px;margin:14px 0 6px;color:var(--blue)}
.club p{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 14px;flex:1}
.meta{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.searchfield{flex:1 1 280px;max-width:420px}
.searchfield .input{min-height:48px;padding:0 14px}
.count{font-size:14px;color:var(--muted);margin-bottom:16px}
.cta{margin-top:28px;border-radius:12px;padding:28px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.cta>div{flex:1 1 380px}
.cta h3{font-size:24px;margin:0 0 6px}
.cta p{margin:0;font-size:16px;line-height:1.5}
.cta-blue{background:var(--blue);color:#fff}
.cta-blue p{color:#D6E0EC}
.cta-maize{background:#fff;border:2px solid var(--maize)}
.cta-maize h3{color:var(--blue)}
.cta-maize p{color:var(--muted)}
.res{padding:22px;display:flex;flex-direction:column}
.res .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.res h3{font-size:18px;margin:0 0 6px;color:var(--blue);line-height:1.3}
.res p{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 14px;flex:1}
.res .todo{font-size:13px;color:var(--muted);font-style:italic}
footer.bottom{background:var(--blue);color:#C9D6E6}
footer.bottom .wrap{padding-top:28px;padding-bottom:28px;display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-size:14px;line-height:1.6}
footer.bottom .fname{font-size:18px;font-weight:700;color:#fff}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  }

  function dateBox(e, lg) {
    return '<div class="datebox' + (lg ? ' lg' : '') + '"><div class="m">' + e.mon + '</div><div class="d">' + e.dayNum + '</div></div>';
  }

  /* ===================== PAGES ===================== */
  function renderNav() {
    $('#nav').innerHTML = PAGES.map(function (p) {
      return '<button data-act="go" data-val="' + p.id + '"' + (S.page === p.id ? ' aria-current="page"' : '') + '>' + p.label + '</button>';
    }).join('');
  }

  function pageHome() {
    var next = computeEvents().filter(function (e) { return e.date >= TODAY; }).slice(0, 3);
    var quick = [
      { id: 'calendar', title: 'Calendar', blurb: 'Every event in your time zone, with one-tap RSVP.' },
      { id: 'feedback', title: 'Feedback', blurb: 'Speak up, anonymously if you like, and see what changed.' },
      { id: 'clubs', title: 'Club directory', blurb: 'Find clubs by industry, career path, or interest.' },
      { id: 'resources', title: 'Resources', blurb: 'Guides, forms, and official links, all in one place.' }
    ];
    var first = TRACKER[0];
    return '' +
      '<section class="hero"><div class="wrap">' +
        '<div class="eyebrow">Welcome back</div>' +
        '<h1 class="serif">One place for everything OMBA.</h1>' +
        '<p>Events, feedback, clubs, and resources, built for students who connect from everywhere and have limited time to look for them.</p>' +
        '<div class="row">' +
          '<button class="btn btn-maize on-dark" data-act="go" data-val="calendar">See upcoming events</button>' +
          '<button class="btn btn-ghost on-dark" data-act="go" data-val="feedback">Share feedback</button>' +
        '</div>' +
      '</div></section>' +
      '<section class="wrap" style="padding-top:40px"><div class="grid g-240">' +
        quick.map(function (q) {
          return '<button class="card lift qcard" data-act="go" data-val="' + q.id + '">' +
            '<span class="qicon">' + icon(ICONS[q.id]) + '</span>' +
            '<span class="qtitle">' + q.title + '</span>' +
            '<span class="qblurb">' + q.blurb + '</span></button>';
        }).join('') +
      '</div></section>' +
      '<section class="wrap split" style="padding-top:32px;padding-bottom:56px">' +
        '<div class="card" style="flex-basis:460px">' +
          '<div class="cardhead"><h2 class="serif">Next up</h2><button class="linkbtn" data-act="go" data-val="calendar">Full calendar</button></div>' +
          next.map(function (e) {
            return '<div class="evrow">' + dateBox(e) + '<div style="flex:1;min-width:0"><div class="evtitle">' + e.title + '</div><div class="sub">' + e.dow + ' · ' + e.time + ' · ' + e.where + '</div></div></div>';
          }).join('') +
        '</div>' +
        '<div class="card">' +
          '<div class="cardhead"><h2 class="serif">You said, we did</h2><button class="linkbtn" data-act="go" data-val="feedback">See all</button></div>' +
          '<div style="border-top:1px solid var(--line2);padding-top:14px">' +
            '<div class="label">You said</div><p class="body16">' + first.said + '</p>' +
            '<div class="label">We did</div><p class="body16" style="margin-bottom:0">' + first.did + '</p>' +
          '</div>' +
        '</div>' +
      '</section>';
  }

  function calendarGrid(events) {
    var firstDay = new Date(2026, S.month, 1).getDay();
    var dim = new Date(2026, S.month + 1, 0).getDate();
    var cells = [], i;
    for (i = 0; i < firstDay; i++) cells.push('<div class="cell empty"></div>');
    for (var d = 1; d <= dim; d++) {
      var iso = '2026-' + pad(S.month + 1) + '-' + pad(d);
      var pills = events.filter(function (e) { return e.date === iso; }).map(function (e) {
        return '<div class="pill cat-' + e.cat + '" title="' + e.full + '">' + e.short + '</div>';
      }).join('');
      cells.push('<div class="cell"><span class="dnum' + (iso === TODAY ? ' today' : '') + '">' + d + '</span>' + pills + '</div>');
    }
    while (cells.length % 7 !== 0) cells.push('<div class="cell empty"></div>');
    return cells.join('');
  }

  function pageCalendar() {
    var all = computeEvents();
    var visible = all.filter(function (e) { return S.cat === 'All' || e.cat === S.cat; });
    var monthEvents = visible.filter(function (e) { return e.month === S.month; });
    var tzBtns = '<div><div class="label">Show times in</div><div class="chips" role="group" aria-label="Time zone">' +
      TZS.map(function (t) {
        return '<button class="chip" data-act="tz" data-val="' + t.id + '" data-key="tz-' + t.id + '" aria-pressed="' + (S.tz === t.id) + '">' + t.label + '</button>';
      }).join('') + '</div></div>';
    var list = monthEvents.length === 0
      ? '<div class="empty-note">No events in this category for this month. Try another category or month.</div>'
      : '<div class="grid g-320">' + monthEvents.map(function (e) {
          var going = !!S.rsvp[e.id];
          return '<div class="card evcard">' + dateBox(e, true) +
            '<div style="flex:1;min-width:0"><span class="tag cat-' + e.cat + '">' + e.cat + '</span>' +
            '<div class="t">' + e.title + '</div>' +
            '<div class="sub">' + e.dow + ' · ' + e.time + '</div>' +
            '<div class="sub">' + e.where + '</div>' +
            '<button class="btn btn-sm ' + (going ? 'btn-on' : 'btn-out') + '" data-act="rsvp" data-val="' + e.id + '" data-key="rsvp-' + e.id + '" aria-pressed="' + going + '">' + (going ? 'You are going' : 'RSVP') + '</button>' +
            '</div></div>';
        }).join('') + '</div>';
    return '<section class="wrap page">' +
      '<h1 class="serif">Calendar</h1>' +
      '<p class="lede">Council events, club meetings, career sessions, and residency prep, shown in your time zone.</p>' +
      '<div class="controls">' + tzBtns + chipRow('Category', 'cat', EVENT_CATS, S.cat, 'cat-') + '</div>' +
      '<div class="calbox">' +
        '<div class="calhead dark">' +
          '<button class="navbtn on-dark" data-act="prev" data-key="prev" aria-label="Previous month"' + (S.month <= FIRST_MONTH ? ' disabled' : '') + '>' +
            '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>' +
          '<h2 class="serif" aria-live="polite">' + MONTHS[S.month] + ' 2026</h2>' +
          '<button class="navbtn on-dark" data-act="next" data-key="next" aria-label="Next month"' + (S.month >= LAST_MONTH ? ' disabled' : '') + '>' +
            '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>' +
        '</div>' +
        '<div class="scroll"><div class="calwrap">' +
          '<div class="dow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>' +
          '<div class="days">' + calendarGrid(visible) + '</div>' +
        '</div></div>' +
      '</div>' +
      '<h2 class="serif" style="font-size:26px;margin:36px 0 16px;color:var(--blue)">' + MONTHS[S.month] + ' events</h2>' +
      list +
    '</section>';
  }

  function trackerHtml() {
    return TRACKER.map(function (t) {
      var ag = !!S.agreed[t.id];
      var cls = t.status === 'Done' ? 'st-Done' : (t.status === 'In progress' ? 'st-prog' : 'st-rev');
      return '<div class="card tcard">' +
        '<span class="status ' + cls + '">' + t.status + '</span>' +
        '<div class="label">You said</div><p class="body16">' + t.said + '</p>' +
        '<div class="label" style="margin-top:0">We did</div><p class="body16">' + t.did + '</p>' +
        '<button class="btn btn-sm ' + (ag ? 'btn-on' : 'btn-out') + '" data-act="agree" data-val="' + t.id + '" data-key="agree-' + t.id + '" aria-pressed="' + ag + '">' + (ag ? 'You agreed' : 'I agree too') + '</button>' +
      '</div>';
    }).join('');
  }

  function formHtml() {
    var topics = ['Program and Academics', 'Residency', 'Career', 'Community and Belonging', 'Tech and Accessibility', 'Something else'];
    return '<h2 class="serif h2" style="margin-bottom:20px">Share your thoughts</h2>' +
      '<div class="stack">' +
        '<div class="field"><label for="fb-cat">Topic</label><select id="fb-cat" class="input">' +
          topics.map(function (t) { return '<option' + (S.fbCat === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label for="fb-msg">Your message</label>' +
          '<textarea id="fb-msg" class="input" rows="6" placeholder="What happened, and what would help?">' + S.fbMsg + '</textarea>' +
          '<div class="err" id="fb-err" role="alert" hidden>Please add a message before submitting.</div></div>' +
        '<label class="checkrow" for="fb-anon"><input id="fb-anon" type="checkbox"' + (S.fbAnon ? ' checked' : '') + '><span>Submit anonymously</span></label>' +
        '<div class="field" id="email-wrap"' + (S.fbAnon ? ' hidden' : '') + '><label for="fb-email">Email for a reply (optional)</label>' +
          '<input id="fb-email" class="input" type="email" placeholder="you@umich.edu"></div>' +
        '<div><button class="btn btn-blue on-dark" data-act="submit">Submit feedback</button>' +
          '<p class="note">Prototype only: nothing is sent anywhere.</p></div>' +
      '</div>';
  }

  function sentHtml() {
    return '<div role="status" style="text-align:center;padding:28px 8px">' +
      '<div class="okmark" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>' +
      '<h2 class="serif h2" style="font-size:26px;margin-bottom:8px">Thank you</h2>' +
      '<p style="font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 22px">The council has your note. Outcomes appear in the tracker next to this form.</p>' +
      '<button class="btn btn-out" data-act="reset">Send another</button></div>';
  }

  function pageFeedback() {
    return '<section class="wrap page">' +
      '<h1 class="serif">Feedback</h1>' +
      '<p class="lede">Tell the council what is working, what is not, and what you would like to see. Every submission is read, and the outcomes are posted publicly.</p>' +
      '<div class="split" style="align-items:flex-start;gap:24px">' +
        '<div class="card" id="fb-card" style="flex:1 1 420px;padding:28px">' + (S.fbSent ? sentHtml() : formHtml()) + '</div>' +
        '<div style="flex:1 1 420px">' +
          '<h2 class="serif h2" style="font-size:26px;margin-bottom:4px">You said, we did</h2>' +
          '<p style="font-size:15px;color:var(--muted);margin:0 0 16px">Student suggestions and what happened next.</p>' +
          '<div style="display:flex;flex-direction:column;gap:14px" id="tracker">' + trackerHtml() + '</div>' +
        '</div>' +
      '</div></section>';
  }

  function clubsList() {
    var q = S.clubQ.trim().toLowerCase();
    var list = CLUBS.filter(function (c) {
      return (S.clubCat === 'All' || c.cat === S.clubCat) &&
        (!q || (c.name + ' ' + c.blurb + ' ' + c.cat).toLowerCase().indexOf(q) !== -1);
    });
    var cards = list.map(function (c) {
      var j = !!S.joined[c.id];
      var words = c.name.split(' ').filter(function (w) { return w !== 'and' && w !== 'the'; });
      var initials = (words[0][0] + (words[1] ? words[1][0] : '')).toUpperCase();
      return '<div class="card lift club">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div class="cluborg" aria-hidden="true">' + initials + '</div><span class="badge">' + c.cat + '</span></div>' +
        '<h3>' + c.name + '</h3><p>' + c.blurb + '</p>' +
        '<div class="meta"><div>' + c.cadence + '</div><div>Lead: [Leader name]</div></div>' +
        '<button class="btn ' + (j ? 'btn-on' : 'btn-blue') + '" style="padding:10px 18px;min-height:46px;font-size:15px" data-act="join" data-val="' + c.id + '" data-key="join-' + c.id + '" aria-pressed="' + j + '">' + (j ? 'Joined' : 'Join club') + '</button>' +
      '</div>';
    }).join('');
    return '<div class="count" role="status">' + list.length + (list.length === 1 ? ' club' : ' clubs') + '</div>' +
      '<div class="grid g-300">' + cards + '</div>' +
      (list.length === 0 ? '<div class="empty-note">No clubs match that search. Try a different word or type.</div>' : '');
  }

  function pageClubs() {
    return '<section class="wrap page">' +
      '<h1 class="serif">Club directory</h1>' +
      '<p class="lede">Find your people by industry, career path, or interest. Every club here welcomes online students.</p>' +
      '<div class="controls" style="margin-bottom:12px">' +
        '<div class="field searchfield"><label class="label" for="club-q">Search clubs</label>' +
          '<input id="club-q" class="input" type="search" value="' + S.clubQ.replace(/"/g, '&quot;') + '" placeholder="Try finance, real estate, parents"></div>' +
        chipRow('Type', 'clubcat', CLUB_CATS, S.clubCat, 'ccat-') +
      '</div>' +
      '<div id="club-list">' + clubsList() + '</div>' +
      '<div class="cta cta-blue"><div><h3 class="serif">Do not see your interest?</h3>' +
        '<p>Starting a club takes a few classmates and a short application. The council can help with the first event.</p></div>' +
        '<button class="btn btn-maize on-dark" data-act="go" data-val="feedback">Contact the council</button></div>' +
    '</section>';
  }

  function resourcesList() {
    var q = S.resQ.trim().toLowerCase();
    var list = RESOURCES.filter(function (r) {
      return (S.resCat === 'All' || r.cat === S.resCat) &&
        (!q || (r.title + ' ' + r.blurb + ' ' + r.cat + ' ' + r.kind).toLowerCase().indexOf(q) !== -1);
    });
    var cards = list.map(function (r) {
      return '<div class="card lift res"><div class="tags">' +
        '<span class="badge" style="background:var(--blue);color:#fff">' + r.cat + '</span>' +
        '<span class="badge" style="background:var(--maize)">' + r.kind + '</span></div>' +
        '<h3>' + r.title + '</h3><p>' + r.blurb + '</p><div class="todo">[Add link]</div></div>';
    }).join('');
    return '<div class="count" role="status">' + list.length + (list.length === 1 ? ' resource' : ' resources') + '</div>' +
      '<div class="grid g-320">' + cards + '</div>' +
      (list.length === 0 ? '<div class="empty-note">Nothing matches that search. Try a different word or topic.</div>' : '');
  }

  function pageResources() {
    return '<section class="wrap page">' +
      '<h1 class="serif">Resources</h1>' +
      '<p class="lede">Official links and student-written guides, gathered in one place so nobody has to hunt for them.</p>' +
      '<div class="controls" style="margin-bottom:12px">' +
        '<div class="field searchfield"><label class="label" for="res-q">Search resources</label>' +
          '<input id="res-q" class="input" type="search" value="' + S.resQ.replace(/"/g, '&quot;') + '" placeholder="Try recruiting, residency, study"></div>' +
        chipRow('Topic', 'rescat', RES_CATS, S.resCat, 'rcat-') +
      '</div>' +
      '<div id="res-list">' + resourcesList() + '</div>' +
      '<div class="cta cta-maize"><div><h3 class="serif">Know something classmates should know?</h3>' +
        '<p>Student guides are the most useful things on this page. Send a tip, a checklist, or a course review.</p></div>' +
        '<button class="btn btn-blue on-dark" data-act="go" data-val="feedback">Suggest a guide</button></div>' +
    '</section>';
  }

  /* ===================== RENDER + ROUTING ===================== */
  var RENDER = { home: pageHome, calendar: pageCalendar, feedback: pageFeedback, clubs: pageClubs, resources: pageResources };
  var TITLES = { home: 'Home', calendar: 'Calendar', feedback: 'Feedback', clubs: 'Clubs', resources: 'Resources' };

  function render(focusKey) {
    renderNav();
    $('#main').innerHTML = RENDER[S.page]();
    document.title = (S.page === 'home' ? '' : TITLES[S.page] + ' | ') + 'OMBA Student Council';
    if (focusKey) {
      var el = document.querySelector('[data-key="' + focusKey + '"]');
      if (el && !el.disabled) el.focus();
    }
  }

  function pageFromHash() {
    var h = (location.hash || '').replace('#', '');
    return RENDER[h] ? h : 'home';
  }

  function go(page) {
    if (location.hash.replace('#', '') === page) { S.page = page; render(); return; }
    location.hash = page === 'home' ? '' : page;
    if (page === 'home') { S.page = 'home'; render(); }
  }

  window.addEventListener('hashchange', function () {
    S.page = pageFromHash();
    render();
    window.scrollTo(0, 0);
    $('#main').focus({ preventScroll: true });
  });

  /* ===================== EVENTS ===================== */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act');
    var val = el.getAttribute('data-val');
    var key = el.getAttribute('data-key');
    switch (act) {
      case 'go': go(val); window.scrollTo(0, 0); return;
      case 'tz': S.tz = val; break;
      case 'cat': S.cat = val; break;
      case 'prev': S.month = Math.max(FIRST_MONTH, S.month - 1); break;
      case 'next': S.month = Math.min(LAST_MONTH, S.month + 1); break;
      case 'rsvp': S.rsvp[val] = !S.rsvp[val]; break;
      case 'agree': S.agreed[val] = !S.agreed[val]; break;
      case 'join': S.joined[val] = !S.joined[val]; break;
      case 'clubcat': S.clubCat = val; break;
      case 'rescat': S.resCat = val; break;
      case 'submit':
        S.fbMsg = ($('#fb-msg') || {}).value || '';
        if (!S.fbMsg.trim()) { $('#fb-err').hidden = false; $('#fb-msg').focus(); return; }
        S.fbSent = true;
        $('#fb-card').innerHTML = sentHtml();
        return;
      case 'reset':
        S.fbSent = false; S.fbMsg = ''; S.fbAnon = true;
        $('#fb-card').innerHTML = formHtml();
        return;
      default: return;
    }
    render(key);
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'club-q') { S.clubQ = t.value; $('#club-list').innerHTML = clubsList(); }
    else if (t.id === 'res-q') { S.resQ = t.value; $('#res-list').innerHTML = resourcesList(); }
    else if (t.id === 'fb-msg') { S.fbMsg = t.value; $('#fb-err').hidden = true; }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'fb-cat') S.fbCat = t.value;
    else if (t.id === 'fb-anon') { S.fbAnon = t.checked; $('#email-wrap').hidden = t.checked; }
  });

  /* ===================== START ===================== */
  S.page = pageFromHash();
  render();
})();
</script>
</body>
</html>
